syntax = "proto3";

package image_cms;

import "google/protobuf/timestamp.proto";


service ImageExportService {
  rpc ExportImages (ExportRequest) returns (stream ImageMessage);
}


message ExportRequest {
  string author_filter = 1; 
  repeated string tag_filter = 2; 
}


message ImageMessage {
  string id = 1;
  bytes image_content = 2; 
  string title = 3;
  string author = 4;
  repeated string tags = 5;
  google.protobuf.Timestamp created_at = 6;
}